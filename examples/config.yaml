# Example: % involucrin (IVL)+ cells among KRT14+ keratinocytes in one field
# (primary human keratinocytes, wide-field ImageXpress; DAPI w1, KRT14 w2 (Cy5 filter), IVL w3 (GFP filter); 0.648 um/px).
# Run from the repository root:   diffquant run examples/config.yaml
output: ../results/example

plates:
  - name: example
    path: example_field

images:
  pattern: '_(?P<well>[A-P]\d{2})_s(?P<site>\d+)_(?P<channel>w\d)'
  pixel_size_um: 0.648

channels:
  DAPI: w1
  IVL: w3
  KRT14: w2

segmentation:
  model: cpsam
  channels: [KRT14, DAPI]
  masks: example_field/masks     # precomputed cpsam masks; delete this line to segment with Cellpose yourself

gate:
  marker: KRT14
  rule: peak_minus
  delta: 0.8                     # calibrated for this staining - see docs/recalibration.md
  upper_mad: 4

readouts:
  - marker: IVL
    rule: otsu_times
    factor: 1.3                  # calibrated for this staining - see docs/recalibration.md

min_gated_cells: 200

focus:
  channels: [DAPI, IVL]

jobs: 2
